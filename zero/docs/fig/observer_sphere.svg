<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The observer choosing charts on a sphere">
  <defs>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
  </defs>
  <!-- sphere cut into patches; unselected patches neutral, selected patches lit -->
  <circle cx="190" cy="150" r="110" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M190,150 L267.8,227.8 A110,110 0 0 1 190,260 Z" fill="#d97706" fill-opacity="0.38" stroke="#888"/>
  <path d="M190,150 L190,260 A110,110 0 0 1 112.2,227.8 Z" fill="#d97706" fill-opacity="0.38" stroke="#888"/>
  <g stroke="#888" stroke-width="1" fill="none">
    <line x1="190" y1="150" x2="300" y2="150"/><line x1="190" y1="150" x2="267.8" y2="227.8"/>
    <line x1="190" y1="150" x2="190" y2="260"/><line x1="190" y1="150" x2="112.2" y2="227.8"/>
    <line x1="190" y1="150" x2="80" y2="150"/><line x1="190" y1="150" x2="112.2" y2="72.2"/>
    <line x1="190" y1="150" x2="190" y2="40"/><line x1="190" y1="150" x2="267.8" y2="72.2"/>
  </g>
  <circle cx="190" cy="150" r="3.5" fill="#888"/>
  <g font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">
    <text x="262" y="178">1</text><text x="228" y="226" fill="#d97706" font-weight="bold">2</text>
    <text x="152" y="226" fill="#d97706" font-weight="bold">3</text><text x="118" y="178">4</text>
    <text x="118" y="128">5</text><text x="152" y="80">6</text>
    <text x="228" y="80">7</text><text x="262" y="128">8</text>
  </g>
  <!-- observer -->
  <rect x="14" y="128" width="62" height="44" rx="8" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <text x="45" y="148" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle" font-weight="bold">observer</text>
  <text x="45" y="164" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle">q · κ</text>
  <line x1="78" y1="150" x2="176" y2="150" stroke="#0ea5e9" stroke-width="2" marker-end="url(#aq)"/>
  <!-- weights -->
  <text x="470" y="30" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">softmax weights w<tspan baseline-shift="sub" font-size="10">k</tspan> over the patches</text>
  <line x1="340" y1="250" x2="600" y2="250" stroke="#888" stroke-width="1.5"/>
  <g stroke="none">
    <rect x="348" y="241" width="20" height="9" fill="#888" fill-opacity="0.45"/>
    <rect x="374" y="136" width="20" height="114" fill="#888" fill-opacity="0.45"/>
    <rect x="400" y="157" width="20" height="93" fill="#888" fill-opacity="0.45"/>
    <rect x="426" y="232" width="20" height="18" fill="#888" fill-opacity="0.45"/>
    <rect x="452" y="238" width="20" height="12" fill="#888" fill-opacity="0.45"/>
    <rect x="478" y="235" width="20" height="15" fill="#888" fill-opacity="0.45"/>
    <rect x="504" y="226" width="20" height="24" fill="#888" fill-opacity="0.45"/>
    <rect x="530" y="235" width="20" height="15" fill="#888" fill-opacity="0.45"/>
  </g>
  <!-- lit bars drawn over: patches 2 and 3 -->
  <rect x="374" y="136" width="20" height="114" fill="#d97706"/>
  <rect x="400" y="157" width="20" height="93" fill="#d97706"/>
  <g font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">
    <text x="358" y="268">1</text><text x="384" y="268" fill="#d97706" font-weight="bold">2</text>
    <text x="410" y="268" fill="#d97706" font-weight="bold">3</text><text x="436" y="268">4</text>
    <text x="462" y="268">5</text><text x="488" y="268">6</text>
    <text x="514" y="268">7</text><text x="540" y="268">8</text>
  </g>
  <text x="400" y="116" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="middle">top-m: observed, so they exist</text>
  <text x="190" y="290" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">each patch is one tiny JEPA with its own chart</text>
</svg>
